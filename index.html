<!DOCTYPE html>
<html>
<head>
  <title>Our Web</title>
</head>

<body>

  <h1>OUR WEB</h1>

  <nav>
    <a href="#home">Home</a>
    <a href="#experiment">Experiment</a>
  </nav>

  <hr>

  <section id="home">
    <h2>Welcome to Our Web</h2>
    <p>Build • Test • Upgrade</p>
  </section>

  <section id="experiment">
    <h2>Experiment #5</h2>

    <input id="userInput" type="text" placeholder="Type something">

    <button onclick="processInput()">SEND</button>

    <p id="result"></p>
  </section>

  <script>
    function processInput() {
      let input = document.getElementById("userInput").value;
      let message = input.toLowerCase().trim();

      if (
        message.includes("hello") ||
        message.includes("hi") ||
        message.includes("hey")
      ) {
        document.getElementById("result").innerText =
          "Hello! 👋";

      } else if (
        message.includes("how are you")
      ) {
        document.getElementById("result").innerText =
          "I'm ready to build! 🚀";

      } else if (
        message.includes("your name") ||
        message.includes("what is your name")
      ) {
        document.getElementById("result").innerText =
          "I'm Our Web! 🤖";

      } else if (
        message.includes("bye") ||
        message.includes("goodbye")
      ) {
        document.getElementById("result").innerText =
          "See you! 👋";

      } else {
        document.getElementById("result").innerText =
          "I don't understand yet.";
      }
    }
  </script>

</body>
</html>
