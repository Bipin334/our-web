<!DOCTYPE html>
<html>
<head>
  <title>Our Web</title>
</head>

<body>

  <h1>OUR WEB</h1>

  <nav>
    <a href="#home">Home</a>
    <a href="#experiment">Experiment</a>
  </nav>

  <hr>

  <section id="home">
    <h2>Welcome to Our Web</h2>
    <p>Build • Test • Upgrade</p>
  </section>

  <section id="experiment">
    <h2>Experiment #2</h2>

    <input id="userInput" type="text" placeholder="Type something">

    <button onclick="processInput()">
      SEND
    </button>

    <p id="result"></p>
  </section>

  <script>
    function processInput() {
      let input = document.getElementById("userInput").value;

      document.getElementById("result").innerText =
        "You typed: " + input;
    }
  </script>

</body>
</html>
